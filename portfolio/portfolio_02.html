<div class="portfolio-section">
  <div class="portfolio-container">

    <!-- Row 1: Comparison bar (outside gallery) -->
    <div class="compare-bar">
      <span class="compare-label-left">slide left or</span>
      <div class="compare-knob"></div>
      <span class="compare-label-right">right to compare</span>
    </div>

    <!-- Row 2: Gallery (4 comparison slides) -->
    <div class="portfolio-row gallery-row row-visible">
      <div class="gallery" data-gallery>
        <div class="gallery-inner">

          <!-- Slide 1 -->
          <div class="gallery-slide compare-slide active">
            <div class="compare-container">
              <img src="images/Image-A.jpg" alt="Before" class="compare-image compare-before">
              <div class="compare-after-wrap">
                <img src="images/Image-B.jpg" alt="After" class="compare-image compare-after">
              </div>
              <div class="compare-line"></div>
            </div>
          </div>

          <!-- Slide 2 -->
          <div class="gallery-slide compare-slide">
            <div class="compare-container">
              <img src="images/Image-A.jpg" alt="Before" class="compare-image compare-before">
              <div class="compare-after-wrap">
                <img src="images/Image-B.jpg" alt="After" class="compare-image compare-after">
              </div>
              <div class="compare-line"></div>
            </div>
          </div>

          <!-- Slide 3 -->
          <div class="gallery-slide compare-slide">
            <div class="compare-container">
              <img src="images/Image-A.jpg" alt="Before" class="compare-image compare-before">
              <div class="compare-after-wrap">
                <img src="images/Image-B.jpg" alt="After" class="compare-image compare-after">
              </div>
              <div class="compare-line"></div>
            </div>
          </div>

          <!-- Slide 4 -->
          <div class="gallery-slide compare-slide">
            <div class="compare-container">
              <img src="images/Image-A.jpg" alt="Before" class="compare-image compare-before">
              <div class="compare-after-wrap">
                <img src="images/Image-B.jpg" alt="After" class="compare-image compare-after">
              </div>
              <div class="compare-line"></div>
            </div>
          </div>

        </div>
        <!-- Invisible previous CTA (left 20% overlay) -->
        <div class="gallery-prev"></div>
      </div>
    </div>

    <!-- Row 3: Indicators (4 bars) -->
    <div class="portfolio-row indicator-row row-visible">
      <div class="indicators" data-indicators>
        <span class="indicator active"></span>
        <span class="indicator"></span>
        <span class="indicator"></span>
        <span class="indicator"></span>
      </div>
    </div>

    <!-- Row 4: Project info -->
    <div class="info-row">
      <div class="info-col info-col-1">
        <h3 class="project-name"><span class="brand-name">Brand B</span> — Before &amp; After Comparisons</h3>
        <p class="project-type">Image Retouching</p>
        <span style="color:#e03131; font-size:0.7rem;"></span>
      </div>
      <div class="info-col info-col-2"></div>
      <div class="info-col info-col-3">
        <p class="project-desc">Drag the knob above to compare before &amp; after. The slideshow pauses while you drag and resumes 3 seconds after you release.</p>
      </div>
    </div>

  </div>
</div>
